[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.93"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# The CPU backend runs the examples' replays in the test suite through
# the debug binary; unoptimised, a frame of the larger examples takes
# tens of seconds, so that crate alone is optimised in dev builds.
[profile.dev.package.orla-cpu]
opt-level = 3

# Line tables are enough for a backtrace and compile faster than full
# debug info.
[profile.dev]
debug = "line-tables-only"
