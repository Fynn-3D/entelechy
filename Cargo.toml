[workspace]
members = ["crates/*/*"]
resolver = "2"

[workspace.package]
version = "0.0.2-rc.1"
edition = "2024"
license = "MIT"
rust-version = "1.93"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# The CPU backend runs the examples' replays in the test suite through
# the debug binary; unoptimised, a frame of the larger examples takes
# tens of seconds, so that crate alone is optimised in dev builds.
[profile.dev.package.orla-cpu]
opt-level = 3

# Line tables are enough for a backtrace and compile faster than full
# debug info.
[profile.dev]
debug = "line-tables-only"
# On macOS debug info otherwise stays in the object files beside each
# binary, and every build leaves new ones: target/debug/deps had grown to
# a million files, and rustc searching it made a test build after touching
# orla-graph take 113 s. Packed into a .dSYM, no object file stays (7 s).
split-debuginfo = "packed"
