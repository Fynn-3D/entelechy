[workspace]
members = ["crates/*/*"]
resolver = "2"

[workspace.package]
version = "0.0.2-rc.3"
edition = "2024"
license = "MIT"
rust-version = "1.93"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# The CPU backend runs the examples' replays in the test suite through
# the debug binary; unoptimised, a frame of the larger examples takes
# tens of seconds, so that crate alone is optimised in dev builds.
[profile.dev.package.entelechy-cpu]
opt-level = 3

# Line tables are enough for a backtrace and compile faster than full
# debug info.
[profile.dev]
debug = "line-tables-only"
# On macOS debug info otherwise stays in the object files beside each
# binary, and every build leaves new ones: target/debug/deps had grown to
# a million files, and rustc searching it made a test build after touching
# entelechy-graph take 113 s. Packed into a .dSYM, no object file stays (7 s).
split-debuginfo = "packed"

# Entelechy built for a page (`wasm32-unknown-unknown`, docs/USAGE.md,
# *WebAssembly*): a page downloads it, and an exported page carries it, so
# it is built small. (The profile is not named `page`: Cargo would keep
# its own files in `target/page`, where the page's build is put.) One unit linked whole lets what is never called go;
# no unwinding tables; no names.
[profile.small]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
