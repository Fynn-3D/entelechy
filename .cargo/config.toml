# Where Entelechy is WebAssembly, the JIT's code is WebAssembly the host
# loads, reached through Entelechy's function table: the table is exported
# for the host to put it in, and may grow.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=--export-table", "-C", "link-arg=--growable-table"]

[target.wasm32-wasip1]
rustflags = ["-C", "link-arg=--export-table", "-C", "link-arg=--growable-table"]

# The repository's own tasks, written in Rust: `cargo xtask verify`.
[alias]
xtask = "run --quiet --package xtask --"
