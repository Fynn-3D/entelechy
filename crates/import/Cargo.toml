[package]
name = "orla-import"
description = "The importer: brings models and sounds in as the Host's files, from outside the runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "orla-import"
path = "src/main.rs"

[dependencies]
orla = { path = "../cli" }
orla-runtime = { path = "../runtime" }
serde_json = "1"
# Lossy and compressed audio: a decoder is not worth writing again. Only
# the interface layer takes dependencies; the runtime crates take none.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm", "mkv"] }

[lints]
workspace = true

[dev-dependencies]
orla-export = { path = "../export" }
