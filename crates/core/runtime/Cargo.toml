[package]
name = "orla-runtime"
description = "Orla Kernel Runtime: prepare, publish, execute, and atomically replace Kernel versions"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false

[dependencies]
orla-rules = { path = "../../core/rules" }
orla-abi = { path = "../../core/abi" }
orla-ir = { path = "../../core/ir" }

[lints]
workspace = true
