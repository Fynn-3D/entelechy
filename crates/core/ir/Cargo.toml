[package]
name = "orla-ir"
description = "Orla IR: typed, SSA-like, backend-neutral Kernel representation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false

[dependencies]
orla-abi = { path = "../../core/abi" }

[dev-dependencies]
orla-compiler = { path = "../../frontend/compiler" }
orla-cpu = { path = "../../backends/cpu" }

[lints]
workspace = true
