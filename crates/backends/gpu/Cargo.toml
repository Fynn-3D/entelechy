[package]
name = "orla-gpu"
description = "GPU backend: emits WGSL from Orla IR and runs it as compute dispatches through wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false

[dependencies]
orla-rules = { path = "../../core/rules" }
orla-abi = { path = "../../core/abi" }
orla-ir = { path = "../../core/ir" }
pollster = "0.4"

# `std` keeps wgpu error scopes thread-local, so the preparation worker and
# the executing thread never share one scope stack.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal", "vulkan", "dx12"] }

# In a page the device is the browser's WebGPU, reached from one thread.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgpu", "fragile-send-sync-non-atomic-wasm"] }

# Under WASI there is no device to reach.
[target.'cfg(all(target_arch = "wasm32", not(target_os = "unknown")))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "fragile-send-sync-non-atomic-wasm"] }

[dev-dependencies]
orla-runtime = { path = "../../core/runtime" }
orla-cpu = { path = "../../backends/cpu" }
orla-compiler = { path = "../../frontend/compiler" }
orla-conformance = { path = "../../backends/conformance" }
orla-graph = { path = "../../core/graph" }

[lints]
workspace = true
