[package]
name = "entelechy-jit"
description = "JIT backend: compiles Entelechy IR to native code through Cranelift, or to WebAssembly where Entelechy is WebAssembly, and runs it on the CPU"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false

[features]
# On WebAssembly, the code the JIT makes is WebAssembly, which the host
# loads (`entelechy.load`, an import the host provides); without this the JIT
# is absent there, and a WebAssembly build imports nothing.
wasm-host = []

[dependencies]
entelechy-rules = { path = "../../core/rules" }
entelechy-abi = { path = "../../core/abi" }
entelechy-ir = { path = "../../core/ir" }

# Cranelift makes native code; on WebAssembly the JIT writes WebAssembly
# itself.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# 0.131 is the newest Cranelift that builds on Rust 1.93; later ones want 1.94.
cranelift-codegen = "0.131"
cranelift-frontend = "0.131"
cranelift-jit = "0.131"
cranelift-module = "0.131"
cranelift-native = "0.131"

[dev-dependencies]
entelechy-cpu = { path = "../../backends/cpu" }
entelechy-compiler = { path = "../../frontend/compiler" }
entelechy-conformance = { path = "../../backends/conformance" }

# The one crate that calls code it produced: it takes its own lints
# rather than the workspace's `unsafe_code = "forbid"`, and keeps every
# `unsafe` block to the call into the compiled function and the reads
# through the pointers that function was handed.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
