[package]
name = "orla-cpu"
description = "CPU backend: executes validated Orla IR through the Capability ABI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false

[dependencies]
orla-rules = { path = "../../core/rules" }
orla-abi = { path = "../../core/abi" }
orla-ir = { path = "../../core/ir" }

[lints]
workspace = true

[dev-dependencies]
orla-compiler = { path = "../../frontend/compiler" }
orla-conformance = { path = "../../backends/conformance" }
