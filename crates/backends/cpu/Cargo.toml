[package]
name = "entelechy-cpu"
description = "CPU backend: executes validated Entelechy IR through the Capability ABI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false

[dependencies]
entelechy-rules = { path = "../../core/rules" }
entelechy-abi = { path = "../../core/abi" }
entelechy-ir = { path = "../../core/ir" }

[lints]
workspace = true

[dev-dependencies]
entelechy-compiler = { path = "../../frontend/compiler" }
entelechy-conformance = { path = "../../backends/conformance" }
