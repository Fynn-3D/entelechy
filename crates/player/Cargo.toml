[package]
name = "orla-player"
description = "Orla Player: a window that shows a live Graph scene and hot-reloads its Kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "orla-player"
path = "src/main.rs"

[dependencies]
orla = { path = "../cli" }
orla-runtime = { path = "../runtime" }
orla-gpu = { path = "../gpu" }
orla-graph = { path = "../graph" }
orla-compiler = { path = "../compiler" }
orla-language = { path = "../language" }
winit = "0.30.13"
softbuffer = "0.4"
cpal = "0.18"
gilrs = "0.11"
serde_json = "1"

[lints]
workspace = true
