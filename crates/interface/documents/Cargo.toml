[package]
name = "entelechy-documents"
description = "Entelechy documents: the scene and libraries a session runs, the Kernels they publish, the Graph they lower to, and the files they read and write"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false

[features]
# Source documents, the `.ent` compiler, `.esn` scene lowering, and live
# file watchers. Disabled when a bundled session needs only `store::Disk`
# and `store::Store` to persist its save files.
default = ["documents"]
documents = [
    "dep:entelechy-compiler",
    "dep:entelechy-language",
    "dep:entelechy-ir",
    "dep:entelechy-graph",
    "dep:entelechy-scene",
    "dep:entelechy-kernel",
    "dep:entelechy-rules",
    "dep:entelechy-formats",
    "dep:entelechy-import",
]

[dependencies]
entelechy-compiler = { path = "../../frontend/compiler", optional = true }
entelechy-language = { path = "../../frontend/language", optional = true }
entelechy-ir = { path = "../../core/ir", optional = true }
entelechy-graph = { path = "../../core/graph", optional = true }
entelechy-scene = { path = "../../frontend/scene", optional = true }
entelechy-kernel = { path = "../../core/kernel", optional = true }
entelechy-rules = { path = "../../core/rules", optional = true }
entelechy-formats = { path = "../../interface/formats", optional = true }
# A font node's font, read as the importer reads one; its other readers
# (audio, models, pictures) left out.
entelechy-import = { path = "../../interface/import", default-features = false, optional = true }

[lints]
workspace = true
