[package]
name = "orla-player"
description = "Orla Player: a window that shows a live Graph scene and hot-reloads its Kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false

[[bin]]
name = "orla-player"
path = "src/main.rs"

[dependencies]
orla-session = { path = "../../interface/session" }
orla-protocol = { path = "../../interface/protocol" }
orla-runtime = { path = "../../core/runtime" }
orla-gpu = { path = "../../backends/gpu" }
orla-graph = { path = "../../core/graph" }
orla-compiler = { path = "../../frontend/compiler" }
orla-language = { path = "../../frontend/language" }
winit = "0.30.13"
softbuffer = "0.4"
cpal = "0.18"
gilrs = "0.11"
serde_json = "1"

[lints]
workspace = true
