[package]
name = "entelechy-player"
description = "Entelechy Player: a window that shows a live Graph scene and hot-reloads its Kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false

[[bin]]
name = "entelechy-player"
path = "src/main.rs"

[dependencies]
entelechy-session = { path = "../../interface/session" }
entelechy-protocol = { path = "../../interface/protocol" }
entelechy-kernel = { path = "../../core/kernel" }
entelechy-gpu = { path = "../../backends/gpu" }
entelechy-graph = { path = "../../core/graph" }
winit = "0.30.13"
softbuffer = "0.4"
cpal = "0.18"
# The inverted axes in `gamepad.rs` are read from this version's database.
gilrs = "=0.11.2"
serde_json = "1"

[lints]
workspace = true
