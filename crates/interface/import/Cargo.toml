[package]
name = "entelechy-import"
description = "The importer: brings models and sounds in as the Host's files, from outside the runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false
path = "src/lib.rs"

[[bin]]
name = "entelechy-import"
path = "src/main.rs"
required-features = ["audio", "models", "vector"]

# The readers beside the font's: lossy and compressed audio, glTF models
# and SVG pictures. The session reads fonts alone, without them.
[features]
default = ["audio", "models", "vector"]
audio = ["dep:symphonia"]
models = ["dep:serde_json"]
vector = ["dep:usvg"]

[dependencies]
entelechy-formats = { path = "../../interface/formats" }
entelechy-host = { path = "../../core/host" }
serde_json = { version = "1", optional = true }
# Lossy and compressed audio: a decoder is not worth writing again. Only
# the interface layer and the two backends' machines take dependencies;
# the runtime crates take none.
symphonia = { version = "0.5", optional = true, default-features = false, features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm", "mkv"] }
# SVG: its CSS, units, shapes and transforms resolved to paths; a parser
# not worth writing again. Text needs fonts and is left out.
usvg = { version = "0.48", optional = true, default-features = false }
# Fonts: TrueType and OpenType outlines and character maps; a parser
# not worth writing again.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

[lints]
workspace = true

