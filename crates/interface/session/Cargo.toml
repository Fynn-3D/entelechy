[package]
name = "orla-session"
description = "Orla session: a live scene over the runtimes, which every interface drives"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false

[dependencies]
orla-compiler = { path = "../../frontend/compiler" }
orla-language = { path = "../../frontend/language" }
orla-ir = { path = "../../core/ir" }
orla-graph = { path = "../../core/graph" }
orla-scene = { path = "../../frontend/scene" }
orla-runtime = { path = "../../core/runtime" }
orla-cpu = { path = "../../backends/cpu" }
orla-gpu = { path = "../../backends/gpu" }
orla-formats = { path = "../../interface/formats" }

# The JIT makes native code, which a WebAssembly machine does not run.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
orla-jit = { path = "../../backends/jit" }

[dev-dependencies]
orla-abi = { path = "../../core/abi" }
orla-conformance = { path = "../../backends/conformance" }
orla-rules = { path = "../../core/rules" }

[lints]
workspace = true
