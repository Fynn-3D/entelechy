[package]
name = "entelechy-session"
description = "Entelechy session: a live scene over the runtimes, which every interface drives"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false

[dependencies]
entelechy-compiler = { path = "../../frontend/compiler" }
entelechy-language = { path = "../../frontend/language" }
entelechy-ir = { path = "../../core/ir" }
entelechy-graph = { path = "../../core/graph" }
entelechy-scene = { path = "../../frontend/scene" }
entelechy-kernel = { path = "../../core/kernel" }
entelechy-rules = { path = "../../core/rules" }
entelechy-cpu = { path = "../../backends/cpu" }
entelechy-gpu = { path = "../../backends/gpu" }
entelechy-jit = { path = "../../backends/jit" }
entelechy-formats = { path = "../../interface/formats" }
entelechy-documents = { path = "../../interface/documents" }

[dev-dependencies]
entelechy-import = { path = "../../interface/import", default-features = false }
entelechy-abi = { path = "../../core/abi" }
entelechy-conformance = { path = "../../backends/conformance" }

[lints]
workspace = true
