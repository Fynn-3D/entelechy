[package]
name = "entelechy-session"
description = "Entelechy session: a live scene over the runtimes, which every interface drives"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false

[features]
# Source documents, the `.ent` compiler, the reference interpreter, and
# replays. Disabled when an exported page plays a compiled `Bundle`.
default = ["documents"]
documents = [
    "dep:entelechy-compiler",
    "dep:entelechy-language",
    "dep:entelechy-scene",
    "dep:entelechy-cpu",
    "entelechy-documents/documents",
]

[dependencies]
entelechy-abi = { path = "../../core/abi" }
entelechy-compiler = { path = "../../frontend/compiler", optional = true }
entelechy-language = { path = "../../frontend/language", optional = true }
entelechy-ir = { path = "../../core/ir" }
entelechy-graph = { path = "../../core/graph" }
entelechy-scene = { path = "../../frontend/scene", optional = true }
entelechy-kernel = { path = "../../core/kernel" }
entelechy-rules = { path = "../../core/rules" }
entelechy-cpu = { path = "../../backends/cpu", optional = true }
entelechy-gpu = { path = "../../backends/gpu" }
entelechy-formats = { path = "../../interface/formats" }
entelechy-documents = { path = "../../interface/documents", default-features = false }

# iOS forbids mapping executable pages for a runtime JIT; bundled iOS apps run
# on Metal (`entelechy-gpu`) with the interpreter beside it for small work.
[target.'cfg(not(target_os = "ios"))'.dependencies]
entelechy-jit = { path = "../../backends/jit" }

[target.'cfg(target_os = "ios")'.dependencies]
entelechy-cpu = { path = "../../backends/cpu" }

[dev-dependencies]
entelechy-import = { path = "../../interface/import", default-features = false }
entelechy-conformance = { path = "../../backends/conformance" }

[lints]
workspace = true
