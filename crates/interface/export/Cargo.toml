[package]
name = "entelechy-export"
description = "The exporter: writes the Host's files as formats other software opens, from outside the runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false
path = "src/lib.rs"

[[bin]]
name = "entelechy-export"
path = "src/main.rs"

[dependencies]
entelechy-formats = { path = "../../interface/formats" }
entelechy-host = { path = "../../core/host" }
serde_json = "1"

[dev-dependencies]
entelechy-import = { path = "../../interface/import" }

[lints]
workspace = true
