[package]
name = "entelechy-ffi"
description = "C ABI host: a session as a library any program loads in its own process, the Fields read in place"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false
name = "entelechy_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
entelechy-session = { path = "../../interface/session" }
entelechy-protocol = { path = "../../interface/protocol" }
entelechy-abi = { path = "../../core/abi" }
entelechy-graph = { path = "../../core/graph" }
entelechy-kernel = { path = "../../core/kernel" }
entelechy-gpu = { path = "../../backends/gpu" }

# Where Entelechy is WebAssembly, the program that loads it (a page) is the
# host of the code the JIT writes.
[target.'cfg(target_arch = "wasm32")'.dependencies]
entelechy-jit = { path = "../../backends/jit", features = ["wasm-host"] }

# In a page, the canvas a picture is presented on is found by its id: the
# page's element, or, in a worker, the OffscreenCanvas the page handed over.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wgpu = { version = "30", default-features = false }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "OffscreenCanvas"] }

# The one crate besides the JIT that takes `unsafe`: it reads the
# pointers and strings a C caller hands it, and nothing else.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
