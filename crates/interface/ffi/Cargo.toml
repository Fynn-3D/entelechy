[package]
name = "orla-ffi"
description = "C ABI host: a session as a library any program loads in its own process, the Fields read in place"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false
name = "orla_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
orla-session = { path = "../../interface/session" }
orla-protocol = { path = "../../interface/protocol" }
orla-abi = { path = "../../core/abi" }
orla-graph = { path = "../../core/graph" }

# Where Orla is WebAssembly, the program that loads it (a page) is the
# host of the code the JIT writes.
[target.'cfg(target_arch = "wasm32")'.dependencies]
orla-jit = { path = "../../backends/jit", features = ["wasm-host"] }

# The one crate besides the JIT that takes `unsafe`: it reads the
# pointers and strings a C caller hands it, and nothing else.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
