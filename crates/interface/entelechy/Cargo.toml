[package]
name = "entelechy"
description = "Entelechy command line: check Kernels, run and watch Graph scenes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

default-run = "entelechy"

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false

[[bin]]
name = "entelechy"
path = "src/main.rs"

[dependencies]
entelechy-compiler = { path = "../../frontend/compiler" }
entelechy-language = { path = "../../frontend/language" }
entelechy-ir = { path = "../../core/ir" }
entelechy-graph = { path = "../../core/graph" }
entelechy-scene = { path = "../../frontend/scene" }
entelechy-kernel = { path = "../../core/kernel" }
entelechy-session = { path = "../../interface/session" }
entelechy-formats = { path = "../../interface/formats" }
entelechy-protocol = { path = "../../interface/protocol" }
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
entelechy-export = { path = "../../interface/export" }
entelechy-conformance = { path = "../../backends/conformance" }
entelechy-cpu = { path = "../../backends/cpu" }
