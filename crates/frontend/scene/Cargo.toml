[package]
name = "entelechy-scene"
description = "Entelechy scene documents: .esn lowered into the Graph model, sub-graphs flattened, inline Kernels handed to the loader"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The crate has no doc tests, so `cargo test` skips the rustdoc pass.
doctest = false

[dependencies]
entelechy-abi = { path = "../../core/abi" }
entelechy-ir = { path = "../../core/ir" }
entelechy-language = { path = "../../frontend/language" }
entelechy-compiler = { path = "../../frontend/compiler" }
entelechy-graph = { path = "../../core/graph" }

[lints]
workspace = true
