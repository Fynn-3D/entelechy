[package]
name = "orla"
description = "Orla command line: check Kernels, run and watch Graph scenes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

default-run = "orla"

[[bin]]
name = "orla"
path = "src/main.rs"

[dependencies]
orla-compiler = { path = "../compiler" }
orla-language = { path = "../language" }
orla-ir = { path = "../ir" }
orla-graph = { path = "../graph" }
orla-runtime = { path = "../runtime" }
orla-gpu = { path = "../gpu" }
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
orla-graph = { path = "../graph" }
serde_json = "1"
