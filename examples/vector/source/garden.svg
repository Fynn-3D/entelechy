<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4c8c"/>
      <stop offset="0.7" stop-color="#e8a36a"/>
      <stop offset="1" stop-color="#f6d69a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.6" stop-color="#ffc861"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8a0f3c"/>
      <stop offset="1" stop-color="#f06a9a"/>
    </linearGradient>
  </defs>
  <!-- The sky, the sun and a ring of light about it. -->
  <rect width="400" height="300" fill="url(#sky)"/>
  <circle cx="300" cy="120" r="46" fill="url(#sun)"/>
  <path d="M300 56 a64 64 0 1 1 0 128 a64 64 0 1 1 0 -128 Z M300 64 a56 56 0 1 0 0 112 a56 56 0 1 0 0 -112 Z"
        fill="#fff3c4" fill-opacity="0.35" fill-rule="evenodd"/>
  <!-- Hills, far and near. -->
  <path d="M0 210 C60 170 120 175 180 200 S300 170 400 195 V300 H0 Z" fill="#6b7f5a"/>
  <path d="M0 240 C80 215 160 250 240 235 S340 215 400 232 V300 H0 Z" fill="#3f5a3a"/>
  <!-- A path through the grass, dashed. -->
  <path d="M40 300 C90 262 150 258 200 250" fill="none" stroke="#e9dcc0" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/>
  <!-- A flower: five petals turned about its heart, half clear leaves. -->
  <g transform="translate(120 170)">
    <g opacity="0.85">
      <path d="M0 40 C-18 32 -22 12 -14 -2 L0 6 L14 -2 C22 12 18 32 0 40 Z" fill="#2f6b3a" transform="rotate(200)"/>
      <path d="M0 40 C-18 32 -22 12 -14 -2 L0 6 L14 -2 C22 12 18 32 0 40 Z" fill="#2f6b3a" transform="rotate(150)"/>
    </g>
    <g fill="url(#petal)" stroke="#5a0a28" stroke-width="1.2">
      <path d="M0 0 C-16 -10 -18 -34 0 -44 C18 -34 16 -10 0 0 Z" transform="rotate(0)"/>
      <path d="M0 0 C-16 -10 -18 -34 0 -44 C18 -34 16 -10 0 0 Z" transform="rotate(72)"/>
      <path d="M0 0 C-16 -10 -18 -34 0 -44 C18 -34 16 -10 0 0 Z" transform="rotate(144)"/>
      <path d="M0 0 C-16 -10 -18 -34 0 -44 C18 -34 16 -10 0 0 Z" transform="rotate(216)"/>
      <path d="M0 0 C-16 -10 -18 -34 0 -44 C18 -34 16 -10 0 0 Z" transform="rotate(288)"/>
    </g>
    <circle r="9" fill="#ffd34d" stroke="#b07a10" stroke-width="1.5"/>
  </g>
</svg>
