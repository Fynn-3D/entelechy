plugins {
    id "com.android.application"
}

android {
    namespace "@@slot:package_id@@"
    compileSdk 34

    defaultConfig {
        applicationId "@@slot:package_id@@"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DENTELECHY_LIB_NAME=@@slot:lib_name@@"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
        }
    }
}
