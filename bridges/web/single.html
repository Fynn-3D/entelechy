<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>@@slot:title@@</title>
<style>
  html, body { margin: 0; height: 100%; background: #090a16; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #shown { pointer-events: none; display: none; }
  /* Subtle corner brand watermark once the scene is live. */
  #brand { position: absolute; top: 14px; left: 16px; display: flex; align-items: center; gap: 7px;
    pointer-events: none; opacity: 0; transition: opacity .45s ease; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .65)); }
  body.ready #brand { opacity: .34; }
  #brand .mark { width: 18px; height: 18px; }
  #brand .word { height: 9px; width: auto; }
  /* Loading screen: Entelechy's constructed seed-graph mark growing as the scene prepares. */
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: radial-gradient(circle at 50% 42%, #131633 0%, #090a16 62%, #05060d 100%);
    color: #cfd5ec; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; transition: opacity .42s ease; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .emblem { width: 108px; height: 110px; filter: drop-shadow(0 0 22px rgba(104, 118, 255, .22)); }
  #loading .wordmark { height: 15px; width: auto; opacity: .92; margin-top: -2px; }
  #loading .tier { transition: opacity .28s ease; }
  #loading .t1 { opacity: .22; }
  #loading .t2 { opacity: .16; }
  #loading .t3 { opacity: .12; }
  #loading[data-stage="1"] .t1 { opacity: 1; }
  #loading[data-stage="2"] .t1, #loading[data-stage="2"] .t2 { opacity: 1; }
  #loading[data-stage="3"] .t1, #loading[data-stage="3"] .t2, #loading[data-stage="3"] .t3 { opacity: 1; }
  @keyframes seedPulse { 0%, 100% { filter: drop-shadow(0 0 6px rgba(255, 179, 51, .45)); } 50% { filter: drop-shadow(0 0 14px rgba(255, 179, 51, .85)); } }
  #loading .seed-glow { animation: seedPulse 2.1s ease-in-out infinite; }
  #loading .name { margin-top: 6px; font-size: 14px; letter-spacing: .12em; color: #eef2ff; }
  #loading .bar { width: min(280px, 58vw); height: 2px; border-radius: 2px; background: rgba(140, 148, 184, .2); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #4dd1ff 0%, #9e6bff 62%, #ffb333 100%); transition: width .2s ease; }
  #loading .what { min-height: 1.4em; font-size: 11px; letter-spacing: .05em; color: #7e86a8; }
  #loading.failed .bar i { background: #e5484d; }
  #loading.failed .what { color: #ff6b70; max-width: 80vw; text-align: center; }
  #prompt { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); padding: 7px 14px;
    border-radius: 999px; background: rgba(9, 10, 22, .76); border: 1px solid rgba(237, 242, 255, .18);
    color: #e6ebff; font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em;
    pointer-events: none; opacity: 0; transition: opacity .2s; backdrop-filter: blur(6px); }
  body.ready[data-pointer="lock"]:not(.locked) #prompt,
  body.ready[data-pointer="hold"]:not(.locked) #prompt { opacity: 1; }
</style>
</head>
<body data-backend="@@slot:backend@@" data-pointer="@@slot:pointer@@">
<!--
A scene exported whole: this one file is the Player in a page, Entelechy's
bundle runtime (`entelechy_single`), and the scene's compiled binary bundle
(validated IR modules, lowered Graph, baked Field inputs and font atlases).
`entelechy export <scene.esn> --out <page>.html` fills this template
(bridges/web/single.html). Nothing is fetched; it opens from the disk.

Everything large is a zlib stream in UTF-8 base122, which the browser
inflates: `single.js` (the page's player), `glue` (what `wasm-bindgen`
wrote), `runtime` (`entelechy_single_bg.wasm`) and `bundle` (`Bundle::encode`).
-->

  <svg class="wordmark" viewBox="-16 -16 862 132" aria-label="ENTELECHY"><use href="#ent-word"/></svg>
  <div class="name">@@slot:title@@</div>

</div>
<script type="text/plain" id="player">@@pack:single.js@@</script>
<script type="text/plain" id="glue">@@slot:glue@@</script>
<script type="text/plain" id="runtime">@@slot:runtime@@</script>
<script type="text/plain" id="bundle">@@slot:bundle@@</script>
<script>
(async () => {
  const takeText = (id) => {
    const el = document.getElementById(id);
    const s = el.textContent;
    el.remove();
    return s;
  };
  const BAD = [0, 10, 13, 34, 38, 60, 62, 92];
  const unpack = (s) => {
    const out = new Uint8Array(((s.length * 14) >> 3) + 1);
    let acc = 0, bits = 0, n = 0;
    const push = (seven) => {
      acc = (acc << 7) | seven;
      bits += 7;
      if (bits >= 8) {
        bits -= 8;
        out[n++] = acc >> bits;
        acc &= (1 << bits) - 1;
      }
    };
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      if (c < 128) push(c);
      else if (c < 0x500) { const v = c - 0x100; push(BAD[v >> 7]); push(v & 127); }
      else push(BAD[c - 0x500]);
    }
    return out.subarray(0, n);
  };
  const inflated = async (id) => {
    const packed = unpack(takeText(id));
    const stream = new Blob([packed]).stream().pipeThrough(new DecompressionStream("deflate"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  };
  const loading = document.getElementById("loading");
  const told = (part, what) => {
    loading.dataset.stage = part >= 0.55 ? "3" : part >= 0.28 ? "2" : part >= 0.08 ? "1" : "0";
    loading.querySelector("i").style.width = `${Math.round(part * 100)}%`;
    loading.querySelector(".what").textContent = what;
    return new Promise((shown) => requestAnimationFrame(() => setTimeout(shown, 0)));
  };
  const words = async (id) => new TextDecoder().decode(await inflated(id));
  try {
    await told(0.05, "unpacking");
    const [playerSource, wasm, bundle, glue] = await Promise.all([
      words("player"),
      inflated("runtime"),
      inflated("bundle"),
      words("glue"),
    ]);
    const script = document.createElement("script");
    script.textContent = playerSource;
    document.head.appendChild(script);
    const player = await globalThis.EntelechySingle.start({
      glue,
      wasm,
      bundle,
      backend: document.body.dataset.backend,
      pointer: document.body.dataset.pointer,
      canvas: document.getElementById("view"),
      shown: document.getElementById("shown"),
      told,
    });
    globalThis.player = player;
    document.getElementById("view").focus();
    told(1, "");
    document.body.classList.add("ready");
    loading.classList.add("done");
    setTimeout(() => loading.remove(), 500);
    player.run();
  } catch (error) {
    document.title = `Entelechy: ${error.message}`;
    loading.classList.add("failed");
    loading.querySelector(".what").textContent = error.message;
    console.error(error);
  }
})();
</script>
</body>
</html>
