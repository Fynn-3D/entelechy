<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Entelechy web bridge test</title>
<script type="importmap">{ "imports": { "entelechy": "./entelechy-host.mjs" } }</script>
</head>
<body>
<!--
Exercises the bridge, against two serving sessions:
  entelechy serve examples/text/scene.esn --listen 127.0.0.1:0    (note the port)
  entelechy serve examples/voxel/scene.esn --listen 127.0.0.1:0   (note the port)
and, with `glue=<path>` (what `wasm-bindgen` wrote for Entelechy built for a
page), against Entelechy in the page, on its JIT and on the browser's WebGPU:
the page is served
from the repository's root by `node bridges/web/test.mjs`, which does all
of it headless, and which answers `/list?roots=a,b` with the files under
them. The page's log ends with `RESULT: ok` when every check passed, or
names the first that failed. It reads the text example's picture and
republishes its background, over a socket and in the page alike; in the
page it also composes the scene and hands a changed one in; and it
drives the voxel editor with a window and a pointer.
-->
<pre id="log"></pre>
<script src="entelechy.js"></script>
<script>
const { EntelechyClient, EntelechyInPage, Driver, decodePpm, decodeWords } = Entelechy;

const log = document.getElementById("log");
const say = (text) => { log.textContent += text + "\n"; };
const assert = (condition, what) => { if (!condition) throw new Error(what); };
const near = (a, b, tolerance, what) => assert(Math.abs(a - b) <= tolerance, `${what}: ${a} is not within ${tolerance} of ${b}`);
const query = new URLSearchParams(location.search);

const pixel = (decoded, x, y) => {
  const i = (y * decoded.width + x) * 4;
  return [decoded.data[i] / 255, decoded.data[i + 1] / 255, decoded.data[i + 2] / 255];
};
const color = (decoded, x, y, rgb, tolerance, what) => {
  const got = pixel(decoded, x, y);
  for (let k = 0; k < 3; k++) near(got[k], rgb[k], tolerance, `${what} at (${x}, ${y}) channel ${k}`);
};

async function textScene(client, where) {
  const status = await client.call("status");
  assert(status.scene.endsWith("scene.esn"), `status: ${JSON.stringify(status)}`);
  const kernels = await client.call("kernels");
  const ids = kernels.kernels.map((k) => k.id);
  assert(ids.includes("text.draw@1"), `kernels: ${ids}`);
  // The picture as the replay pins it: the title's E at (8, 6) twice the size.
  await client.call("evaluate", { time: 0 });
  const read = await client.call("read", { format: "ppm" });
  assert(read.width === 192 && read.height === 88, `size ${read.width}x${read.height}`);
  const frame = decodePpm(read.data);
  color(frame, 10, 6, [1.0, 0.85, 0.45], 0.02, "the E's top");
  color(frame, 12, 9, [0.09, 0.1, 0.13], 0.02, "the E's gap");
  say(`text ${where}: picture read`);
  // The background is the node's inline Kernel: its source comes back as
  // publish takes it (the id written in, the node's domain left out), so
  // a recolored copy publishes over it and the gap in the E changes.
  const back = await client.call("kernel", { kernel: "scene.back@1" });
  say(`text ${where}: background source fetched`);
  assert(back.source.startsWith("kernel scene.back@1 {") && !back.source.includes("domain ="), `source as publish takes it: ${back.source}`);
  const recolored = back.source.replace("vec4(0.09, 0.1, 0.13, 1.0)", "vec4(0.3, 0.1, 0.1, 1.0)");
  assert(recolored !== back.source, `the background color is where expected: ${back.source}`);
  let refused = null;
  try {
    await client.call("prepare", { source: recolored.replace("vec4(", "vec5(") });
  } catch (error) {
    refused = error;
  }
  assert(refused && refused.line > 0 && refused.message.includes("vec5"), `a diagnostic names the problem and its line: ${refused}`);
  say(`text ${where}: a broken Kernel is refused with a position`);
  const published = await client.call("publish", { source: recolored, expect: "any" });
  assert(published.id === "scene.back@1", `published ${published.id}`);
  await client.call("evaluate", { time: 0.1 });
  const again = decodePpm((await client.call("read", { format: "ppm" })).data);
  color(again, 12, 9, [0.3, 0.1, 0.1], 0.02, "the recolored gap");
  color(again, 10, 6, [1.0, 0.85, 0.45], 0.02, "the title still");
  say(`text ${where}: background republished`);
}

/// Entelechy in the page, over the text example's files and the packages.
async function inPage(glue) {
  const fetched = async (path) => {
    const response = await fetch(`/${path}`);
    assert(response.ok, `${path}: ${response.status}`);
    return new Uint8Array(await response.arrayBuffer());
  };
  const list = await (await fetch("/list?roots=examples/text,packages")).json();
  const entelechy = await EntelechyInPage.load(`/${glue}`);
  for (const path of list) entelechy.put(path, await fetched(path));
  await entelechy.open("examples/text/scene.esn");
  // The JIT, its code WebAssembly this page loaded: a Kernel it could not
  // load would be refused, and the picture would say so.
  const about = await entelechy.call("status");
  assert(about.backend === "jit", `in the page on ${about.backend}`);
  await textScene(entelechy, "in the page");
  const gap = async (rgb, what) => {
    await entelechy.call("evaluate", { time: 0.2 });
    color(decodePpm((await entelechy.call("read", { format: "ppm" })).data), 12, 9, rgb, 0.02, what);
  };
  // A composed scene is written to the files handed in and read back.
  const document = await entelechy.call("document");
  const green = document.text.replace("vec4(0.09, 0.1, 0.13, 1.0)", "vec4(0.1, 0.3, 0.1, 1.0)");
  assert(green !== document.text, "the scene's background is where expected");
  await entelechy.call("compose", { text: green, expect: document.version });
  await gap([0.1, 0.3, 0.1], "the composed background");
  say("text in the page: composed");
  // A file handed in again is a file changed on disk: a sync reads it.
  entelechy.put("examples/text/scene.esn", new TextEncoder().encode(green.replace("vec4(0.1, 0.3, 0.1, 1.0)", "vec4(0.1, 0.1, 0.3, 1.0)")));
  const synced = await entelechy.call("sync");
  assert(synced.events.some((event) => JSON.stringify(event).includes("scene")), `sync: ${JSON.stringify(synced)}`);
  await gap([0.1, 0.1, 0.3], "the background handed in");
  say("text in the page: a file handed in again is read");
  entelechy.close();
  // The same checks on the browser's WebGPU, the GPU backend's own code
  // waiting for the device by giving the page turns.
  const gpu = await EntelechyInPage.load(`/${glue}`);
  for (const path of list) gpu.put(path, await fetched(path));
  await gpu.open("examples/text/scene.esn", "gpu");
  const about_gpu = await gpu.call("status");
  assert(about_gpu.backend === "gpu", `on the page's GPU, on ${about_gpu.backend}`);
  await textScene(gpu, "on the page's GPU");
  // Presented from the device on a canvas of its own, nothing read back:
  // what the canvas shows is the picture, the republished background in
  // the E's gap and the title around it.
  const view = window.document.createElement("canvas");
  view.width = 192;
  view.height = 88;
  const shown = window.document.createElement("canvas");
  shown.id = "shown";
  window.document.body.append(view, shown);
  const driver = new Driver(gpu, view, shown);
  await driver.step();
  assert(driver.presented, "the GPU's picture is presented, not read back");
  const copy = window.document.createElement("canvas");
  copy.width = shown.width;
  copy.height = shown.height;
  const copied = copy.getContext("2d");
  copied.drawImage(shown, 0, 0);
  const presented = { width: copy.width, height: copy.height, data: copied.getImageData(0, 0, copy.width, copy.height).data };
  color(presented, 12, 9, [0.3, 0.1, 0.1], 0.02, "the presented gap");
  color(presented, 10, 6, [1.0, 0.85, 0.45], 0.02, "the presented title");
  say("text on the page's GPU: presented on a canvas, nothing read back");
  gpu.close();
  // The voxel editor's Kernels are large: each is loaded as this page's
  // code, or the scene does not run.
  const voxelFiles = await (await fetch("/list?roots=examples/voxel,packages")).json();
  for (const backend of ["jit", "gpu"]) {
    const voxel = await EntelechyInPage.load(`/${glue}`);
    for (const path of voxelFiles) voxel.put(path, await fetched(path));
    await voxel.open("examples/voxel/scene.esn", backend);
    const report = await voxel.call("evaluate", { time: 0, window: [240, 135] });
    const shown = report.outputs.find((output) => output.width > 0);
    assert(shown && shown.width === 240 && shown.height === 135, `voxel in the page on ${backend}: ${JSON.stringify(report.outputs)}`);
    const read = await voxel.call("read", { output: shown.name, format: "ppm" });
    assert(decodePpm(read.data).width === 240, `voxel in the page on ${backend}: the picture reads back`);
    say(`voxel in the page: a frame on the ${backend === "jit" ? "JIT" : "GPU"}`);
    voxel.close();
  }
  await webglConformance(glue);
}

async function webglConformance(glue) {
  const enc = new TextEncoder();
  const wglCanvas = window.document.createElement("canvas");
  wglCanvas.id = "wgl-av";
  wglCanvas.width = 64;
  wglCanvas.height = 36;
  window.document.body.appendChild(wglCanvas);
  const prevOnly = globalThis.entelechy_webgl_only;
  const prevCanvas = globalThis.entelechy_webgl_canvas;
  globalThis.entelechy_webgl_only = true;
  globalThis.entelechy_webgl_canvas = wglCanvas;
  try {
    const conformanceEsn = `
kernel wgl.narrow_write@1 {
  requires { field.write; }
  output unorm_out: Rows<Vec4 as unorm8>;
  output half_out: Rows<Float as f16>;
  output short_out: Rows<Int as i16>;
  compute {
    let i = element();
    let f = float(i) / 7.0;
    return { unorm_out: vec4(f, 1.0 - f, 0.5, 1.0), half_out: f * 2.0 - 1.0, short_out: i * 17 - 40 };
  }
}
kernel wgl.narrow_read@1 {
  requires { field.read; field.write; }
  input u: Rows<Vec4 as unorm8>;
  input h: Rows<Float as f16>;
  input s: Rows<Int as i16>;
  output sums: Rows<Float>;
  output ints: Rows<Int>;
  compute {
    let a = sample(u);
    let b = sample(h);
    let c = sample(s);
    return { sums: a.x + a.y + b, ints: c + clz(c & 255) + popcount(c & 63) };
  }
}
node nw: wgl.narrow_write@1 { domain = 8; }
node nr: wgl.narrow_read@1 { u <- nw.unorm_out; h <- nw.half_out; s <- nw.short_out; }
output sums <- nr.sums;
output ints <- nr.ints;
`;
    const runBackend = async (backend) => {
      const s = await EntelechyInPage.load(`/${glue}`);
      s.put("scene.esn", enc.encode(conformanceEsn));
      await s.open("scene.esn", backend);
      await s.call("pin", { node: "nw" });
      await s.call("evaluate", { time: 0 });
      const sums = decodeWords((await s.call("read", { output: "sums", format: "words" })).data);
      const ints = decodeWords((await s.call("read", { output: "ints", format: "words" })).data);
      s.close();
      return { sums, ints };
    };
    const ref = await runBackend("jit");
    const got = await runBackend("gpu");
    for (let i = 0; i < 8; i++) {
      assert(got.ints.int(i) === ref.ints.int(i), `WebGL2 narrow+multi int[${i}]: ${got.ints.int(i)} vs ${ref.ints.int(i)}`);
      assert(Math.abs(got.sums.float(i) - ref.sums.float(i)) <= 1e-3, `WebGL2 narrow+multi float[${i}]: ${got.sums.float(i)} vs ${ref.sums.float(i)}`);
    }
    say("WebGL2 conformance: narrow encodings (unorm8, f16, i16), multi-output Map, and bit intrinsics match JIT");

    // Exact arithmetic failure reporting on WebGL2 (division by zero at element 5).
    const failEsn = `
kernel wgl.divzero@1 {
  requires { field.write; }
  output out: Rows<Int>;
  compute {
    let d = if element() == 5 { 0 } else { 1 };
    return 100 / d;
  }
}
node dz: wgl.divzero@1 { domain = 16; }
output out <- dz.out;
`;
    const failSess = await EntelechyInPage.load(`/${glue}`);
    failSess.put("scene.esn", enc.encode(failEsn));
    await failSess.open("scene.esn", "gpu");
    let caught = "";
    try {
      await failSess.call("evaluate", { time: 0 });
    } catch (e) {
      caught = e.message || String(e);
    }
    failSess.close();
    assert(/division by zero/i.test(caught) && /5/.test(caught), `WebGL2 arithmetic failure named at element 5, got: ${caught}`);
    say("WebGL2 conformance: arithmetic failure names division by zero at exact element");

    // Simultaneous WebGL2 zero-copy present + GPU sound readback leaves default screen FBO complete.
    const avEsn = `
kernel wgl.pic@1 {
  requires { field.write; }
  output result: Image;
  compute {
    let s = loop 64 with acc = 0.0 { acc + sin(float(index()) * 0.1) * 0.001 };
    return vec4(0.2 + s, 0.6, 0.9, 1.0);
  }
}
kernel wgl.sfx@1 {
  requires { field.write; time.read; }
  output result: Rows<Vec2>;
  compute {
    let e = float(element()) + time();
    let v = loop 64 with acc = 0.0 { acc + sin(e * 0.05 + float(index())) * 0.002 };
    return vec2(v, -v);
  }
}
node pic: wgl.pic@1 { domain = vec2(128, 72); }
node sfx: wgl.sfx@1 { domain = 4096; }
output screen <- pic.result;
output sound <- sfx.result to sound;
`;
    const av = await EntelechyInPage.load(`/${glue}`);
    try {
      wglCanvas.width = 128;
      wglCanvas.height = 72;
      av.put("scene.esn", enc.encode(avEsn));
      await av.open("scene.esn", "gpu");
      const x = av.x;
      while (x.entelechy_play_preparing(av.session) > 0) {
        assert(x.entelechy_play_turn(av.session) >= 0, "preparing turn failed");
      }
      await av.withBytes(enc.encode("48000 Hz\0"), (p) => x.entelechy_play_sound_opened(av.session, p));
      const fieldPtr = x.entelechy_alloc(36);
      try {
        for (let f = 0; f < 3; f++) {
          if (f > 0) await new Promise((r) => setTimeout(r, 5));
          x.entelechy_play_sound_queued(av.session, 0);
          const framed = x.entelechy_play_frame(av.session, 128, 72, 1, 48000);
          assert(framed === 0, `WebGL2 AV frame ${f}: ${framed} (${av.text(x.entelechy_error(av.session))})`);
          const heard = x.entelechy_play_sound(av.session, fieldPtr);
          if (f > 0) assert(heard === 0, `WebGL2 GPU sound readback frame ${f}: ${heard}`);
          const drawn = av.withBytes(enc.encode("wgl-av\0"), (p) => x.entelechy_play_present(av.session, p));
          assert(drawn === 0, `WebGL2 present frame ${f}: ${drawn}`);
          const gl = wglCanvas.getContext("webgl2");
          assert(gl.getParameter(gl.DRAW_FRAMEBUFFER_BINDING) === null, "DRAW_FRAMEBUFFER_BINDING restored to null");
          assert(gl.getParameter(gl.READ_FRAMEBUFFER_BINDING) === null, "READ_FRAMEBUFFER_BINDING restored to null");
          assert(gl.checkFramebufferStatus(gl.READ_FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE, "READ_FRAMEBUFFER complete for compositor");
          assert(gl.getError() === gl.NO_ERROR, "zero WebGL errors after sound readback + present");
        }
      } finally {
        x.entelechy_free(fieldPtr, 36);
      }
      say("WebGL2 conformance: GPU sound readback + zero-copy present keeps default framebuffer complete");
    } finally {
      av.close();
    }
  } finally {
    wglCanvas.remove();
    globalThis.entelechy_webgl_only = prevOnly;
    globalThis.entelechy_webgl_canvas = prevCanvas;
  }
}

async function voxelScene(port) {
  const client = await EntelechyClient.open(`ws://127.0.0.1:${port}`);
  // A canvas is the window: the replay's 240 by 135, and the Driver sends
  // its size with every evaluate. The scale is the device's; at scale one
  // the bar is laid out full size, so the pointer aims at the picture.
  const canvas = document.createElement("canvas");
  canvas.width = 240;
  canvas.height = 135;
  document.body.appendChild(canvas);
  const driver = new Driver(client, canvas);
  await client.call("pin", { node: "state" });
  await driver.step();
  assert(driver.frame.width === 240 && driver.frame.height === 135, `frame ${driver.frame.width}x${driver.frame.height}`);
  driver.pointer = [120, 78];
  await driver.step();
  const state = await client.call("read", { node: "state", port: "result", format: "words" });
  const words = decodeWords(state.data);
  // Edit { yaw, pitch, zoom, pan(3), px, py, down, right, middle, on_bar,
  // painting, erasing, stroked, tool, color, hover, found, hit(3), ... }
  assert(words.float(6) === 120 && words.float(7) === 78, `pointer ${words.float(6)}, ${words.float(7)}`);
  assert(words.bool(18), "the pointer finds a voxel");
  assert(words.float(19) === 27 && words.float(20) === 11 && words.float(21) === 27, `hit ${words.float(19)} ${words.float(20)} ${words.float(21)}`);
  say("voxel: pointer finds the tree");
  // The left button places a voxel on the face seen: (27, 12, 27) is 62811.
  driver.buttons.add(0);
  await driver.step();
  driver.buttons.delete(0);
  await client.call("pin", { node: "world" });
  await driver.step();
  const world = decodeWords((await client.call("read", { node: "world", port: "result", format: "words" })).data);
  assert(world.int(62811) === 1, `placed voxel is ${world.int(62811)}`);
  say("voxel: a click places a voxel");
  // A wider canvas is a resize: the picture follows the window.
  canvas.width = 320;
  canvas.height = 180;
  await driver.step();
  assert(driver.frame.width === 320 && driver.frame.height === 180, `resized frame ${driver.frame.width}x${driver.frame.height}`);
  say("voxel: the picture follows the window");
  client.close();
}

(async () => {
  try {
    const text = await EntelechyClient.open(`ws://127.0.0.1:${query.get("text")}`);
    await textScene(text, "over a socket");
    text.close();
    if (query.get("glue")) await inPage(query.get("glue"));
    await voxelScene(query.get("voxel"));
    say("RESULT: ok");
  } catch (error) {
    say(`RESULT: failed: ${error.message}`);
  }
})();
</script>
</body>
</html>
